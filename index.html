<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shaun Vincent — UI/UX Designer</title>
    <meta name="description" content="Shaun Vincent is a Winnipeg-based UI/UX and visual designer with 5+ years of experience across product design, branding, and web, and the founder of Tucked, a calm, private budget app." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#F4F4F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)" />
    <!-- Theme bootstrap: runs before first paint so the prerendered page never
         flashes the wrong theme. A saved choice (from the navbar toggle) wins;
         otherwise follow the OS. Also marks <html class="js"> so scroll-reveal
         styles only hide content when JS is actually there to reveal it. -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add("js");
        var t = null;
        try { t = localStorage.getItem("pf-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        d.setAttribute("data-theme", t);
      })();
    </script>
    <!-- Fonts are self-hosted from /fonts (see the @font-face rules at the top of
         src/portfolio.css): latin-only subsets with the weight axis trimmed to
         what the page uses. Serving them from this origin removes two
         cross-origin connections (fonts.googleapis.com + fonts.gstatic.com)
         from the mobile critical path. The rental application / admin tools
         still load their own font set on demand (src/lib/legacyFonts.ts).
         The stylesheet is attached after first paint (src/lib/loadFonts.ts) so
         ~100 KB of fonts never competes with the HTML on a slow connection;
         text paints in the fallback face first and swaps, as it did before. -->
    <noscript><link rel="stylesheet" href="/fonts/fonts.css" /></noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
